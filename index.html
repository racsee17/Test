<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloodwork Historical Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>📊 Bloodwork Historical Tracker</h1>
        
        <div class="upload-section">
            <div class="upload-area">
                <h3>📄 Upload Bloodwork Files</h3>
                <input type="file" id="fileInput" multiple accept=".pdf,.txt,.json" />
                <button onclick="uploadFiles()">Parse & Add to History</button>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="testFilter">🔍 Filter by Test:</label>
                <select id="testFilter" onchange="filterTests()">
                    <option value="">All Tests</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="categoryFilter">📋 Filter by Category:</label>
                <select id="categoryFilter" onchange="filterTests()">
                    <option value="">All Categories</option>
                </select>
            </div>
            
            <div class="control-group">
                <button onclick="showTrends()">📈 Show Trends</button>
                <button onclick="exportData()">💾 Export Data</button>
            </div>
        </div>

        <div class="timeline-container">
            <h2>📅 Historical Timeline</h2>
            <div id="timelineContent">No bloodwork data loaded yet.</div>
        </div>
        
        <div class="trends-container" id="trendsContainer" style="display: none;">
            <h2>📈 Trend Analysis</h2>
            <div class="chart-grid" id="chartGrid"></div>
        </div>
        
        <div class="condensed-container">
            <h2>📋 Condensed View</h2>
            <div class="view-toggle">
                <button onclick="showCondensedView('table')" class="toggle-btn active" id="tableViewBtn">📊 Table View</button>
                <button onclick="showCondensedView('cards')" class="toggle-btn" id="cardsViewBtn">🃏 Cards View</button>
            </div>
            <div id="condensedContent">Upload bloodwork files to see condensed results.</div>
        </div>
        
        <div class="details-container">
            <h2>🔬 Detailed Results</h2>
            <div id="detailsContent">Upload bloodwork files to see detailed results.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
